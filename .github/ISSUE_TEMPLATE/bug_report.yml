name: Bug report / 问题报告
description: Report a reproducible problem using synthetic data / 使用合成数据复现问题
body:
  - type: markdown
    attributes:
      value: |
        Please remove tokens, connection URLs, private rows and private paths. Do not attach state.sqlite, backups or a full DSH session. For vulnerabilities, follow SECURITY.md.
        请脱敏，不要上传状态库、备份或完整聊天；漏洞请按 SECURITY.md 私下报告。
  - type: textarea
    id: versions
    attributes:
      label: Versions and environment / 版本与环境
      description: Stellane, DSH, Node, OS, package or source install, PostgreSQL / local Neon / Stello; no credentials.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction / 最小复现
      description: Include synthetic schema/data, the question or UI steps, and whether it occurs in a fresh chat.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed / 预期与实际
      description: Include a redacted error or screenshot, and whether any operation remains unknown or any branch remains retained.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Checks already performed / 已做检查
      description: Record the exact check and outcome; do not retry an unknown write or branch creation to reproduce it.
